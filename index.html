<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>高野さん、それ聞きました</title>
<style>
  :root{
    --sky-top:#141d3d;
    --sky-mid:#4b3566;
    --sky-low:#c9714f;
    --sun:#ffd27a;
    --sea:#0d2c40;
    --paper:#fff6ea;
    --ink:#14101a;
    --lane1:#6fd3e8;
    --lane2:#ffb35c;
    --lane3:#ff7fa8;
    --ng:#8c8494;
    --gold:#ffd75e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#0a0812;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  #wrap{
    height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;padding:8px;
  }
  #title{
    color:var(--paper);font-size:13px;letter-spacing:.14em;opacity:.75;
  }
  #title b{color:var(--lane3);letter-spacing:.06em;font-size:15px;}
  #stage{
    position:relative;width:100%;max-width:420px;aspect-ratio:3/4;
    max-height:calc(100vh - 70px);
    border-radius:14px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,246,234,.12);
    background:#0d0a18;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:22px;
    background:linear-gradient(180deg,rgba(10,8,18,.93),rgba(20,13,30,.97));
    color:var(--paper);text-align:center;
  }
  .overlay.hide{display:none;}
  #startScreen{
    justify-content:flex-end;
    background:linear-gradient(180deg,
      rgba(10,8,18,0) 0%, rgba(10,8,18,.28) 24%,
      rgba(13,10,20,.9) 48%, rgba(13,10,20,.97) 100%);
    padding:14px 22px 22px;
  }
  #demoHint{
    color:var(--paper); opacity:.55; font-size:10px; letter-spacing:.08em;
    margin-bottom:2px;
  }
  .overlay h2{
    margin:0;font-size:22px;letter-spacing:.04em;line-height:1.3;
  }
  .overlay p{margin:0;font-size:12.5px;line-height:1.75;opacity:.85;max-width:330px;}
  .overlay p.left{text-align:left;}
  .btn{
    margin-top:6px;border:none;border-radius:999px;cursor:pointer;
    padding:12px 30px;font-size:15px;font-weight:800;letter-spacing:.08em;
    color:var(--ink);background:var(--sun);
    box-shadow:0 6px 0 #b98f3d;
    font-family:inherit;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b98f3d;}
  .btn.ghost{background:transparent;color:var(--paper);box-shadow:0 0 0 1px rgba(255,246,234,.35);}
  .btn.ghost:active{transform:translateY(2px);box-shadow:0 0 0 1px rgba(255,246,234,.35);}
  .keys{display:flex;gap:8px;justify-content:center;margin-top:2px;}
  .key{
    font-size:10.5px;opacity:.6;border:1px solid rgba(255,246,234,.3);
    border-radius:6px;padding:4px 9px;letter-spacing:.06em;
  }
  .diffRow{display:flex;gap:6px;justify-content:center;margin-top:4px;}
  .diffBtn{
    font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.03em;
    color:var(--paper);background:rgba(255,246,234,.08);
    border:1px solid rgba(255,246,234,.25);border-radius:999px;
    padding:6px 13px;cursor:pointer;
  }
  .diffBtn.active{
    background:var(--gold);color:var(--ink);border-color:var(--gold);
  }
  #resTable{
    font-size:12.5px;line-height:1.9;letter-spacing:.04em;
    border-collapse:collapse;
  }
  #resTable td{padding:0 10px;}
  #resTable td:first-child{opacity:.65;text-align:right;}
  #resTable td:last-child{text-align:left;font-weight:800;font-variant-numeric:tabular-nums;}
  #rank{font-size:52px;font-weight:900;line-height:1;letter-spacing:.02em;}
  #foot{
    color:var(--paper);opacity:.38;font-size:10px;text-align:center;
    line-height:1.7;max-width:420px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="title"><b>高野さん、それ聞きました</b>　相槌の攻防</div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="shareCv" style="display:none"></canvas>

    <div class="overlay" id="startScreen">
      <div id="demoHint">— デモプレイ中 —</div>
      <h2>高野さん、それ聞きました</h2>
      <p>スイッチが入ると頼れる兄貴。<br>でも今は、話が止まらない。</p>
      <p class="left">
        ・落ちてくる相槌を、線に重なった瞬間にタップ<br>
        ・<b style="color:var(--lane1)">へー</b> / <b style="color:var(--lane2)">まじすか</b> / <b style="color:var(--lane3)">ちなみに?</b> の3レーン<br>
        ・長いバーは<b>押しっぱなし</b>で「うんうん」<br>
        ・<b style="color:#ff6b6b">聞きました</b>は叩かず見送る（叩くと拗ねる）<br>
        ・20連続で<b style="color:var(--gold)">兄貴モード</b>、話が仕事に着地する
      </p>
      <div class="diffRow" id="diffRow">
        <button class="diffBtn" data-diff="easy">かんたん</button>
        <button class="diffBtn active" data-diff="normal">ふつう</button>
        <button class="diffBtn" data-diff="hard">むずかしい</button>
      </div>
      <button class="btn" id="btnStart">話を聞く</button>
      <div class="keys">
        <span class="key">D / F / J</span><span class="key">← ↓ →</span>
        <button class="key" id="btnVoice" style="cursor:pointer;">🔊 音声ON</button>
      </div>
    </div>

    <div class="overlay hide" id="resultScreen">
      <div id="rank">S</div>
      <h2 id="resTitle" style="font-size:17px"></h2>
      <p id="resFeedback" style="font-size:12px;max-width:300px;"></p>
      <table id="resTable"><tbody id="resBody"></tbody></table>
      <button class="btn" id="btnNext">次の話へ</button>
      <button class="btn ghost" id="btnShare">画像を保存</button>
      <button class="btn ghost" id="btnRetry">もう一回</button>
    </div>
  </div>
  <div id="foot">高野さんの話は3本。全部さばけたら定時。</div>
</div>

<script>
(function(){
'use strict';

/* ============================ setup ============================ */
var VW = 480, VH = 640;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

function resize(){
  var r = cv.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(r.width  * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(cv.width / VW, 0, 0, cv.height / VH, 0, 0);
}
window.addEventListener('resize', resize);

/* lane geometry */
var LANE_W = 118, LANE_GAP = 8;
var LANES_X = [];
(function(){
  var total = LANE_W * 3 + LANE_GAP * 2;
  var left = (VW - total) / 2;
  for (var i = 0; i < 3; i++) LANES_X.push(left + i * (LANE_W + LANE_GAP));
})();
var FIELD_TOP = 196;
var JUDGE_Y   = 528;

var LANE_LABEL = ['へー', 'まじすか', 'ちなみに?'];
var LANE_COLOR = ['#6fd3e8', '#ffb35c', '#ff7fa8'];
var LANE_DEEP  = ['#1c5f73', '#7d5220', '#7d3350'];

/* ============================ difficulty ============================ */
var DIFF_LABEL = { easy:'かんたん', normal:'ふつう', hard:'むずかしい' };
var APPROACH_BY_DIFF = { easy: 1.5, normal: 1.15, hard: 0.72 };  // seconds spawn→judge line
function currentSpeed(){
  var ap = APPROACH_BY_DIFF[game.difficulty] || 1.35;
  return (JUDGE_Y - FIELD_TOP + 46) / ap;
}
/* how many seconds ago a note fell that is now `px` pixels past the line,
   at the current difficulty's fall speed */
function pxToTime(px){ return px / currentSpeed(); }

/* thin the note grid for easy (mute the 2nd/4th quarter of each measure)
   or densify it for hard (fill spare eighth-note rests with extra taps) —
   every chart is authored on a quarter-note grid (indices 0,2,4,6),
   leaving the odd eighth-note slots free for hard mode to use. */
function thinPat(pat){
  return pat.map(function(row){
    var c = row.split('');
    [2, 6].forEach(function(i){
      if ((c[i] >= '1' && c[i] <= '3') || c[i] === 'x' || c[i] === 'y' || c[i] === 'z') c[i] = '.';
    });
    return c.join('');
  });
}
function densifyPat(pat){
  return pat.map(function(row, ri){
    var c = row.split('');
    for (var i = 1; i < 8; i += 2){
      if (c[i] === '.' && (ri + i) % 4 !== 0){
        c[i] = String(((ri * 3 + i) % 3) + 1);
      }
    }
    return c.join('');
  });
}
function patForDifficulty(pat){
  if (game.difficulty === 'easy') return thinPat(pat);
  if (game.difficulty === 'hard') return densifyPat(pat);
  return pat;
}
/* hard mode: sprinkle in simultaneous two-lane taps (deterministic, ~1 in 5
   taps). Multi-touch already works — each finger/key is tracked by its own
   pointerId/keycode — so doubles are playable as-is on phone or keyboard. */
function addDoubles(notes, mod){
  mod = mod || 5;
  var extra = [];
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.type !== 'tap') continue;
    var seed = Math.floor(n.t * 97 + n.lane * 31);
    if (seed % mod === 0){
      var other = (n.lane + (seed % 2 === 0 ? 1 : 2)) % 3;
      extra.push({ lane: other, t: n.t, type: 'tap', hit: false, dead: false });
    }
  }
  return notes.concat(extra).sort(function(a, b){ return a.t - b.t; });
}

/* timing windows, expressed as pixel distance from the visible judge line
   (measured at normal-difficulty fall speed). Easy's slower fall stretches
   this into more reaction time; hard's faster fall compresses it — the same
   visible zone around the line, just harder to time. */
var W_PERFECT = 0.070, W_GREAT = 0.125, W_GOOD = 0.180, W_MISS = 0.230;
var NORMAL_SPD = (JUDGE_Y - FIELD_TOP + 46) / APPROACH_BY_DIFF.normal;
var PX_PERFECT = W_PERFECT * NORMAL_SPD;
var PX_GREAT   = W_GREAT   * NORMAL_SPD;
var PX_GOOD    = W_GOOD    * NORMAL_SPD;
var PX_MISS    = W_MISS    * NORMAL_SPD;

/* ============================ charts ============================ */
/* pattern chars, 8 per measure (eighth notes):
   .        rest
   1 2 3    tap in lane
   a b c    hold head in lane   (following '-' extend it)
   x y z    "聞きました" trap in lane (must NOT hit)          */
var CHARTS = [

      '1.2.3.1.','2.3.1.2.','1.1.3.3.','a---2.2.',
      '3.1.2.3.','1.2.1.2.','3.3.2.2.','y.1.2.3.',
      '1.3.2.1.','b---3.2.','1.2.3.1.','2.1.3.x.',
      '1.1.2.3.','3.2.1.2.','c---1.3.','2.3.1.2.',
      '1.2.3.y.','3.1.3.1.','2.2.3.3.','1.2.1.z.',
      'a---3.1.','2.3.2.1.','1.3.2.3.','y.2.1.2.',
      '3.1.2.1.','b---2.3.','1.2.3.1.','3.2.1.x.',
      '1.1.2.2.','3.3.2.1.','c---....','1.2.3...'
    ]
  }
];

/* ============================ lighting themes ============================ */
/* 5 stops crossfaded by overall progress across the 3 songs — mirrors the
   real Fukuoka Tower's seasonal lightup themes from the tower-dash game. */
var THEMES = [
  { name:'普遍的な光',       top:'#141d3d', mid:'#4b3566', low:'#c9714f', sun:'#ffd27a', tower:'#eef0e6', ring:'#ffffff', sea:'#0d2c40' },
  { name:'ももち☆ブルーライト', top:'#0b1733', mid:'#173463', low:'#2f6ea0', sun:'#bfe6ff', tower:'#7fd2ff', ring:'#bfe6ff', sea:'#0a2438' },
  { name:'天の川',           top:'#070b20', mid:'#211b42', low:'#3a2c60', sun:'#d8d4ff', tower:'#c9c3ff', ring:'#e8e4ff', sea:'#070c22' },
  { name:'お月見',           top:'#080d1e', mid:'#221d33', low:'#463a3a', sun:'#ffe6a8', tower:'#ffd98c', ring:'#ffe6a8', sea:'#07111d' },
  { name:'限界突破フルカラー', top:'#05060f', mid:'#150e28', low:'#241634', sun:'#ffe6f2', tower:'#ffffff', ring:'#ffffff', sea:'#04060d' }
];
function hexRgb(h){
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
  var n = parseInt(h, 16);
  return [ (n>>16)&255, (n>>8)&255, n&255 ];
}
function lerpRgb(h1, h2, t){
  var a = hexRgb(h1), b = hexRgb(h2);
  return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i]-a[i]) * t); });
}
function rgbStr(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgbaStr(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

function visualProgress(){
  var local = game.songLen ? Math.min(1, Math.max(0, songTime()/game.songLen)) : 0;
  return (game.stage + local) / CHARTS.length;
}

var STARS = (function(){
  var arr = [];
  for (var i = 0; i < 36; i++){
    arr.push({
      x: Math.random()*VW, y: Math.random()*(FIELD_TOP-20)+6,
      r: 1 + Math.random()*1.6, sp: 1 + Math.random()*2, ph: Math.random()*7
    });
  }
  return arr;
})();

/* real recorded voice clips (松尾さん収録), embedded as base64 mp3 so they

function b64ToArrayBuffer(b64){
  var bin = atob(b64);
  var len = bin.length;
  var bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
var voiceBuffers = {};
function loadVoiceBuffers(){
  Object.keys(VOICE_B64).forEach(function(k){
    try {
      actx.decodeAudioData(b64ToArrayBuffer(VOICE_B64[k]),
        function(buf){ voiceBuffers[k] = buf; },
        function(){});
    } catch(e){}
  });
}

var actx = null, master = null;
function initAudio(){
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);
  loadVoiceBuffers();
}
function now(){ return actx ? actx.currentTime : performance.now()/1000; }

function beep(t, freq, dur, type, vol){
  if (!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function kick(t){
  if (!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.12);
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
}
var noiseBuf = null;
function getNoise(){
  if (noiseBuf || !actx) return noiseBuf;
  var n = actx.sampleRate * 0.3;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function hat(t, vol){
  if (!actx) return;
  var s = actx.createBufferSource(); s.buffer = getNoise();
  var f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  var g = actx.createGain();
  g.gain.setValueAtTime(vol || 0.13, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.07);
}
function pluck(t, freq, vol){
  if (!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
}
function sfxHit(kind){
  if (!actx) return;
  var t = now();
  if (kind === 'perfect'){ beep(t, 1170, 0.09, 'triangle', 0.24); beep(t+0.03, 1560, 0.07, 'triangle', 0.16); }
  else if (kind === 'great'){ beep(t, 980, 0.08, 'triangle', 0.2); }
  else if (kind === 'good'){ beep(t, 700, 0.08, 'sine', 0.17); }
  else if (kind === 'miss'){ beep(t, 190, 0.16, 'sawtooth', 0.13); }
  else if (kind === 'trap'){ beep(t, 150, 0.3, 'square', 0.16); beep(t+0.06, 110, 0.3, 'square', 0.12); }
  else if (kind === 'aniki'){
    [523,659,784,1046].forEach(function(f,i){ beep(t+i*0.06, f, 0.22, 'triangle', 0.2); });
  }
}

/* 'voice' — play the real recorded clips embedded above; if a buffer hasn't
   finished decoding yet (first instant after page load), fall back to a
   synthesized talk-blip on the same Web Audio engine as the BGM so
   something always plays either way. */
function voiceTone(t, freq, dur){
  if (!actx) return;
  var o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
  o1.type = 'triangle'; o2.type = 'triangle';
  o1.frequency.setValueAtTime(freq, t);
  o2.frequency.setValueAtTime(freq * 1.5, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(t); o1.stop(t + dur + 0.02);
  o2.start(t); o2.stop(t + dur + 0.02);
}
var VOICE_PATTERNS = {
  hee:       [ {f:330,d:0.09}, {f:255,d:0.17} ],
  majisuka:  [ {f:300,d:0.07},{f:345,d:0.07},{f:255,d:0.07},{f:420,d:0.11} ],
  chinamini: [ {f:280,d:0.06},{f:300,d:0.06},{f:260,d:0.06},{f:320,d:0.06},{f:470,d:0.15} ],
  unun:      [ {f:225,d:0.10},{f:0,d:0.05},{f:215,d:0.13} ]
};
function voiceBlip(kind){
  if (!actx) return;
  var seq = VOICE_PATTERNS[kind];
  if (!seq) return;
  var tt = now();
  seq.forEach(function(n){
    if (n.f > 0) voiceTone(tt, n.f, n.d);
    tt += n.d + 0.015;
  });
}
function voiceLine(kind){
  if (!game.voiceOn || !actx) return;
  var buf = voiceBuffers[kind];
  if (buf){
    var src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; g.gain.value = 0.95;
    src.connect(g); g.connect(master);
    src.start(now());
  } else {
    voiceBlip(kind);
  }
}

var bgm = { beat: 0, next: 0, on: false, spb: 0.5 };
var BASS = [0, 0, 5, 5, 3, 3, 7, 7];
function scheduleBgm(){
  if (!bgm.on || !actx) return;
  var look = now() + 0.14;
  while (bgm.next < look){
    var t = bgm.next, b = bgm.beat % 8;
    if (b % 2 === 0) kick(t);
    hat(t + bgm.spb/2, 0.09);
    hat(t, b % 4 === 2 ? 0.16 : 0.1);
    var bassLine = (CHARTS[game.stage] && CHARTS[game.stage].bass) || BASS;
    var root = 110 * Math.pow(2, bassLine[b] / 12);
    beep(t, root, bgm.spb * 0.8, 'sawtooth', game.aniki ? 0.11 : 0.075);
    if (game.aniki && b % 4 === 0) beep(t, root * 3, bgm.spb * 0.5, 'square', 0.05);
    var leadLine = CHARTS[game.stage] && CHARTS[game.stage].lead;
    if (leadLine && leadLine[b] !== null && leadLine[b] !== undefined){
      var leadFreq = 110 * Math.pow(2, leadLine[b] / 12);
      pluck(t + bgm.spb * 0.12, leadFreq, game.aniki ? 0.17 : 0.115);
    }
    bgm.beat++; bgm.next += bgm.spb;
  }
}

/* ============================ game state ============================ */
var game = {
  mode: 'title',      // title | count | play | result
  stage: 0,
  difficulty: 'normal', // easy | normal | hard
  notes: [],
  startTime: 0,
  songLen: 0,
  mood: 60,           // 0-100
  combo: 0, maxCombo: 0,
  score: 0,
  aniki: false,
  counts: { perfect:0, great:0, good:0, miss:0 },
  total: 0,
  lineIdx: 0,
  judgeText: '', judgeTime: -9, judgeKind: '',
  flash: 0,
  shake: 0,
  reaction: { kind: null, time: -9 },  // 'chi' (trap misfire) | 'slump' (miss/dropped hold)
  trapHit: 0,
  cameo: { list: [], next: 0, win: null },  // 実さん乱入イベント
  costume: false, tripleHoldStart: null, costumeToast: -9,
  lastHeartbeat: -9,
  voiceOn: true,
  lastResult: null
};
try { if (localStorage.getItem('takano_costume_unlocked') === '1') game.costume = true; } catch(e){}
var laneFx = [0,0,0];        // hit flash per lane
var laneHeld = [false,false,false];
var pointerLane = {};        // pointerId -> lane
var particles = [];

function buildNotes(chart){
  var spb = 60 / chart.bpm, e = spb / 2;
  var notes = [], pending = null;
  for (var m = 0; m < chart.pat.length; m++){
    var row = chart.pat[m];
    for (var i = 0; i < 8; i++){
      var c = row.charAt(i);
      var t = (m * 8 + i) * e;
      if (c === '-'){ if (pending) pending.end = t + e; continue; }
      pending = null;
      if (c >= '1' && c <= '3'){
        notes.push({ lane:+c-1, t:t, type:'tap', hit:false, dead:false });
      } else if (c === 'a' || c === 'b' || c === 'c'){
        var n = { lane:'abc'.indexOf(c), t:t, end:t+e, type:'hold',
                  hit:false, dead:false, holding:false, done:false, ticks:0 };
        notes.push(n); pending = n;
      } else if (c === 'x' || c === 'y' || c === 'z'){
        notes.push({ lane:'xyz'.indexOf(c), t:t, type:'trap', hit:false, dead:false });
      }
    }
  }
  notes.sort(function(a,b){ return a.t - b.t; });
  return { notes: notes, len: chart.pat.length * 8 * e, spb: spb };
}

function startStage(idx){
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  game.stage = idx;
  var chart = CHARTS[idx];
  var built = buildNotes({ bpm: chart.bpm, pat: patForDifficulty(chart.pat) });
  if (game.difficulty === 'hard') built.notes = addDoubles(built.notes, 4);
  else if (game.difficulty === 'normal') built.notes = addDoubles(built.notes, 7);
  else built.notes = addDoubles(built.notes, 14);
  game.notes = built.notes;
  game.songLen = built.len;
  game.total = 0;
  for (var i=0;i<game.notes.length;i++) if (game.notes[i].type !== 'trap') game.total++;
  game.mood = 60; game.combo = 0; game.maxCombo = 0; game.score = 0;
  game.aniki = false;
  game.counts = { perfect:0, great:0, good:0, miss:0 };
  game.lineIdx = 0;
  game.judgeTime = -9; game.flash = 0; game.shake = 0;
  game.reaction = { kind: null, time: -9 }; game.trapHit = 0;
  var cameoFracs = chart.cameo || [];
  game.cameo = {
    list: cameoFracs.map(function(f){ return f * built.len; }),
    next: 0, win: null
  };
  particles.length = 0;
  laneHeld = [false,false,false];
  pointerLane = {};

  bgm.spb = built.spb;
  var lead = 2.4;
  game.startTime = now() + lead;
  bgm.beat = 0; bgm.next = game.startTime - built.spb * 4; bgm.on = true;
  if (bgm.next < now()) bgm.next = now() + 0.05;
  game.mode = 'count';
  hide(startScreen); hide(resultScreen);
}

/* ============================ judging ============================ */
function songTime(){ return now() - game.startTime; }

function addScore(base){
  game.score += Math.round(base * (game.aniki ? 2 : 1) * (1 + Math.min(game.combo, 50) * 0.01));
}
function setJudge(text, kind){
  game.judgeText = text; game.judgeKind = kind; game.judgeTime = now();
}
function breakCombo(){
  if (game.aniki && game.combo >= 20) game.flash = 0.25;
  game.combo = 0; game.aniki = false;
}
function gainCombo(){
  game.combo++;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;
  if (!game.aniki && game.combo >= 20){ game.aniki = true; sfxHit('aniki'); game.flash = 0.4; }
}
function moodAdd(v){
  game.mood = Math.max(0, Math.min(100, game.mood + v));
  if (game.mood <= 0 && game.mode === 'play') endStage(false);
}
function burst(lane, color, n){
  var cx = LANES_X[lane] + LANE_W/2;
  for (var i=0;i<n;i++){
    particles.push({
      x: cx + (Math.random()-0.5)*40, y: JUDGE_Y,
      vx: (Math.random()-0.5)*130, vy: -60 - Math.random()*160,
      life: 0.5 + Math.random()*0.3, age: 0, c: color
    });
  }
}

function pressLane(lane){
  if (game.mode !== 'play' && game.mode !== 'count') return;
  laneHeld[lane] = true; laneFx[lane] = 1;
  if (game.mode !== 'play') return;
  if (game.cameo.win && !game.cameo.win.resolved){
    game.cameo.win.resolved = true;
    addScore(250); moodAdd(6);
    setJudge('実!', 'perfect'); sfxHit('aniki');
    burst(0, '#ffd75e', 6); burst(1, '#ffd75e', 6); burst(2, '#ffd75e', 6);
  }
  var t = songTime(), spd = currentSpeed();
  var best = null, bestPx = 99999;
  for (var i = 0; i < game.notes.length; i++){
    var n = game.notes[i];
    if (n.lane !== lane || n.hit || n.dead) continue;
    if (n.type === 'hold' && n.holding) continue;
    var y = JUDGE_Y - (n.t - t) * spd;
    var px = Math.abs(y - JUDGE_Y);
    if (px < bestPx){ bestPx = px; best = n; }
  }
  if (!best || bestPx > PX_MISS) return;

  if (best.type === 'trap'){
    best.hit = true; best.dead = true;
    setJudge('叩いた', 'bad'); sfxHit('trap');
    breakCombo(); moodAdd(-16); game.shake = 0.4;
    game.trapHit++; game.reaction = { kind: 'chi', time: now() };
    return;
  }
  var kind, base;
  if (bestPx <= PX_PERFECT){ kind='perfect'; base=300; }
  else if (bestPx <= PX_GREAT){ kind='great'; base=200; }
  else if (bestPx <= PX_GOOD){ kind='good'; base=100; }
  else { kind='good'; base=60; }

  game.counts[kind]++;
  addScore(base);
  gainCombo();
  moodAdd(kind === 'perfect' ? 3.2 : kind === 'great' ? 2.4 : 1.4);
  setJudge(kind === 'perfect' ? 'ばっちり' : kind === 'great' ? 'いい相槌' : 'まあまあ', kind);
  sfxHit(kind);
  if (kind === 'perfect' || kind === 'great') voiceLine(['hee','majisuka','chinamini'][lane]);
  burst(lane, LANE_COLOR[lane], kind === 'perfect' ? 12 : 7);

  if (best.type === 'hold'){ best.holding = true; best.hit = true; }
  else { best.hit = true; best.dead = true; }
}
function releaseLane(lane){
  laneHeld[lane] = false;
  for (var i = 0; i < game.notes.length; i++){
    var n = game.notes[i];
    if (n.type === 'hold' && n.holding && n.lane === lane && !n.done){
      var t = songTime();
      if (t < n.end - 0.09){
        n.holding = false; n.done = true; n.dead = true;
        setJudge('話を折った', 'bad'); sfxHit('miss');
        breakCombo(); moodAdd(-9);
        game.reaction = { kind: 'slump', time: now() };
      }
    }
  }
}

function updateNotes(dt){
  var t = songTime();
  var missT = pxToTime(PX_MISS);
  for (var i = 0; i < game.notes.length; i++){
    var n = game.notes[i];
    if (n.dead) continue;

    if (n.type === 'hold' && n.holding && !n.done){
      n.ticks += dt;
      if (n.ticks > 0.12){
        n.ticks = 0; addScore(28); moodAdd(0.5);
        burst(n.lane, LANE_COLOR[n.lane], 2);
      }
      if (t >= n.end){
        n.done = true; n.dead = true;
        addScore(160); gainCombo(); moodAdd(2.6);
        setJudge('うんうん', 'perfect'); sfxHit('perfect'); voiceLine('unun');
        burst(n.lane, LANE_COLOR[n.lane], 14);
      }
      continue;
    }
    if (n.type === 'trap'){
      if (t > n.t + missT){ n.dead = true; addScore(60); moodAdd(1.2);
        setJudge('聞き流した', 'great'); }
      continue;
    }
    if (!n.hit && t > n.t + missT){
      n.dead = true; game.counts.miss++;
      breakCombo(); moodAdd(-8);
      setJudge('スルー', 'bad'); sfxHit('miss');
      game.reaction = { kind: 'slump', time: now() };
    }
  }
  /* line advance */
  var chart = CHARTS[game.stage];
  var per = game.songLen / chart.lines.length;
  var li = Math.min(chart.lines.length - 1, Math.floor(Math.max(0,t) / per));
  game.lineIdx = li;

  /* 実さん乱入イベント */
  var cm = game.cameo;
  if (cm.win){
    var age = t - cm.win.start;
    if (!cm.win.resolved && age > 1.1) cm.win = null;
    else if (cm.win.resolved && age > 1.5) cm.win = null;
  } else if (cm.next < cm.list.length && t >= cm.list[cm.next]){
    cm.win = { start: t, resolved: false };
    cm.next++;
  }

  if (t > game.songLen + 1.6 && game.mode === 'play') endStage(true);
}

function endStage(cleared){
  game.mode = 'result';
  bgm.on = false;
  var c = game.counts;
  var acc = game.total ? (c.perfect + c.great*0.75 + c.good*0.45) / game.total : 0;
  var rank = !cleared ? 'F' : acc >= 0.94 ? 'S' : acc >= 0.84 ? 'A' : acc >= 0.70 ? 'B' : acc >= 0.5 ? 'C' : 'D';
  var key = 'takano_aizuchi_' + game.stage;
  var best = 0;
  try { best = parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch(e){}
  if (cleared && game.score > best){
    best = game.score;
    try { localStorage.setItem(key, String(best)); } catch(e){}
  }
  showResult(cleared, rank, best);
}

/* ============================ drawing ============================ */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawScene(t){
  var p = visualProgress();
  var segs = THEMES.length - 1;
  var pos = Math.min(segs, p * segs);
  var i = Math.min(segs - 1, Math.floor(pos));
  var f = pos - i;
  var A = THEMES[i], B = THEMES[i+1];

  var topRgb   = lerpRgb(A.top,   B.top,   f);
  var midRgb   = lerpRgb(A.mid,   B.mid,   f);
  var lowRgb   = lerpRgb(A.low,   B.low,   f);
  var sunRgb   = lerpRgb(A.sun,   B.sun,   f);
  var towerRgb = lerpRgb(A.tower, B.tower, f);
  var ringRgb  = lerpRgb(A.ring,  B.ring,  f);
  var seaRgb   = lerpRgb(A.sea,   B.sea,   f);
  var themeName = game.aniki ? '限界突破フルカラー' : (f < 0.5 ? A.name : B.name);

  /* sky, deepening toward night as progress advances */
  var g = ctx.createLinearGradient(0, 0, 0, FIELD_TOP);
  g.addColorStop(0, rgbStr(topRgb));
  g.addColorStop(0.55, rgbStr(midRgb));
  g.addColorStop(1, rgbStr(lowRgb));
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, FIELD_TOP);

  /* stars fade in as the sky darkens */
  var starAlpha = Math.max(0, Math.min(1, (p - 0.12) / 0.5));
  if (starAlpha > 0){
    ctx.save();
    for (var s = 0; s < STARS.length; s++){
      var sd = STARS[s];
      var tw = 0.5 + 0.5 * Math.sin(t * sd.sp + sd.ph);
      ctx.globalAlpha = starAlpha * (0.35 + 0.5 * tw);
      ctx.fillStyle = '#fff6ea';
      ctx.fillRect(sd.x, sd.y, sd.r, sd.r);
    }
    ctx.restore();
  }

  /* sun fading toward a pale moon */
  ctx.fillStyle = rgbaStr(sunRgb, 0.75 - p * 0.25);
  ctx.beginPath(); ctx.arc(96, 150, 26, 0, Math.PI*2); ctx.fill();

  /* bay */
  ctx.fillStyle = rgbStr(seaRgb); ctx.fillRect(0, 158, VW, FIELD_TOP - 158);

  /* Fukuoka Tower — dot-matrix mesh, like its real ~8000 mirror panels,
     lit to the current theme (rainbow sweep during 兄貴モード) */
  var tx = 372, base = 162, h = 118, botW = 15, topW = 2;
  var hue = game.aniki ? (t * 90) % 360 : null;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx - botW, base); ctx.lineTo(tx - topW, base - h);
  ctx.lineTo(tx + topW, base - h); ctx.lineTo(tx + botW, base);
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,8,17,.5)'; ctx.fill();

  var rows = 15;
  for (var r = 0; r < rows; r++){
    var frac = r / (rows - 1);
    var yy = base - h * frac;
    var halfW = botW + (topW - botW) * frac;
    var cols = Math.max(1, Math.round(halfW / 2.6));
    for (var cIdx = -cols; cIdx <= cols; cIdx++){
      var xx = tx + (cols ? (cIdx / cols) * halfW : 0);
      var hash = (r * 13 + (cIdx + cols) * 7) % 11;
      var tw = 0.55 + 0.45 * Math.sin(t * (1.2 + hash*0.15) + hash);
      var da = 0.32 + 0.55 * tw;
      if (game.aniki){
        var dh = (hue + r*16 + (cIdx+cols)*22) % 360;
        ctx.fillStyle = 'hsla(' + dh + ',85%,68%,' + da + ')';
      } else {
        ctx.fillStyle = rgbaStr(towerRgb, da);
      }
      ctx.fillRect(xx - 1.1, yy - 1.1, 2.2, 2.2);
    }
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,246,234,' + (0.4 + 0.35*Math.sin(t*4)) + ')';
  ctx.beginPath(); ctx.arc(tx, base - h - 5, 3, 0, Math.PI*2); ctx.fill();

  /* tower light reflected in the bay */
  ctx.save();
  ctx.globalAlpha = 0.22 + 0.1 * Math.sin(t*2.4);
  ctx.fillStyle = game.aniki ? ('hsla(' + hue + ',70%,72%,1)') : rgbStr(towerRgb);
  ctx.fillRect(tx - 4, 159, 8, FIELD_TOP - 159 - 12);
  ctx.restore();

  /* window mullions */
  ctx.strokeStyle = 'rgba(14,10,22,.55)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, FIELD_TOP); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(VW, 96); ctx.stroke();

  /* sill */
  ctx.fillStyle = '#1b1526'; ctx.fillRect(0, FIELD_TOP - 12, VW, 12);

  /* current lighting theme label */
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = rgbStr(towerRgb);
  ctx.font = '700 9px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(themeName, tx, base + 3);
  ctx.restore();
}

function drawTakano(x, y, s, t){
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  var talk = game.mode === 'play' ? (0.5 + 0.5*Math.sin(t*11)) : 0.2;
  var bob = Math.sin(t * 3.1) * 2;

  var reactAge = now() - game.reaction.time;
  var reactT = Math.max(0, 1 - reactAge / 0.45);
  var droop = game.reaction.kind === 'slump' ? reactT * 9 : 0;
  var jitter = game.reaction.kind === 'chi' ? Math.sin(reactAge * 42) * reactT * 3.5 : 0;
  ctx.translate(jitter, bob + droop);
  if (droop) ctx.rotate(0.05 * reactT);

  var aniki = game.aniki;
  var casual = game.costume && !aniki;
  /* body */
  ctx.fillStyle = aniki ? '#23232b' : (casual ? '#3a5a78' : '#6b7245');
  rr(-24, -30, 48, 52, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,22); ctx.stroke();
  /* chest pocket (work jacket only — the off-duty shirt has none) */
  if (!casual){
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.strokeRect(6, -20, 13, 10);
  }
  /* arms */
  ctx.fillStyle = aniki ? '#1b1b22' : (casual ? '#2e4760' : '#5d6440');
  rr(-34, -26, 12, 34, 6); ctx.fill();
  rr(22, -26, 12, 34, 6); ctx.fill();
  /* neck */
  ctx.fillStyle = '#f0c9a0'; ctx.fillRect(-6, -36, 12, 10);
  /* head */
  ctx.fillStyle = '#f0c9a0';
  ctx.beginPath(); ctx.ellipse(0, -50, 17, 18, 0, 0, Math.PI*2); ctx.fill();
  /* hair — dark and messy */
  ctx.fillStyle = '#2b2229';
  ctx.beginPath();
  ctx.ellipse(0, -60, 18, 12, 0, Math.PI, 0); ctx.fill();
  for (var i = -2; i <= 2; i++){
    ctx.beginPath();
    ctx.moveTo(i*7 - 3, -66);
    ctx.quadraticCurveTo(i*7 + 2, -76 - (i%2?3:0), i*7 + 6, -65);
    ctx.fill();
  }
  if (aniki){
    /* helmet + mask */
    ctx.fillStyle = '#eceff1';
    ctx.beginPath(); ctx.ellipse(0, -60, 21, 17, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-22, -61, 44, 4);
    ctx.fillStyle = '#dfe6ea';
    rr(-13, -48, 26, 15, 5); ctx.fill();
  } else {
    /* eyes */
    ctx.fillStyle = '#2b2229';
    ctx.beginPath(); ctx.arc(-6, -52, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -52, 2.1, 0, Math.PI*2); ctx.fill();
    /* mouth — opens while talking */
    ctx.fillStyle = '#8c3b3b';
    ctx.beginPath();
    ctx.ellipse(0, -42, 5 + talk*3, 2 + talk*5, 0, 0, Math.PI*2); ctx.fill();
  }

  if (reactT > 0){
    ctx.save();
    ctx.globalAlpha = reactT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    if (game.reaction.kind === 'chi'){
      ctx.fillStyle = '#ff8a8a';
      ctx.font = '800 13px "Hiragino Kaku Gothic ProN",sans-serif';
      ctx.fillText('チッ', 22, -70);
      ctx.strokeStyle = 'rgba(255,138,138,' + reactT + ')'; ctx.lineWidth = 2;
      for (var li = 0; li < 3; li++){
        ctx.beginPath();
        ctx.moveTo(10 + li*5, -80 - li*2); ctx.lineTo(16 + li*5, -86 - li*2); ctx.stroke();
      }
    } else if (game.reaction.kind === 'slump'){
      ctx.fillStyle = '#9fb0d8';
      ctx.font = '700 12px "Hiragino Kaku Gothic ProN",sans-serif';
      ctx.fillText('はぁ…', 0, -70);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawBubble(t){
  var chart = CHARTS[game.stage];
  var txt = chart.lines[game.lineIdx] || '';
  if (game.aniki) txt = ['で、その現場なんやけど', '図面、俺が引いとくわ',
                         '任しとき', 'ちなみに納期は死守な'][game.lineIdx % 4];
  ctx.save();
  var x = 108, y = 108, w = 176, h = 46;
  ctx.fillStyle = game.aniki ? 'rgba(255,215,94,.94)' : 'rgba(255,246,234,.94)';
  rr(x, y, w, h, 12); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 1, y + 22); ctx.lineTo(x - 14, y + 30); ctx.lineTo(x - 1, y + 36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#14101a';
  ctx.font = '600 13px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var lines = wrap(txt, 12);
  for (var i = 0; i < lines.length; i++){
    ctx.fillText(lines[i], x + w/2, y + h/2 + (i - (lines.length-1)/2) * 17);
  }
  ctx.restore();
}
function wrap(s, n){
  var out = [];
  for (var i = 0; i < s.length; i += n) out.push(s.substr(i, n));
  return out.length ? out : [''];
}

function drawCameo(t){
  var cw = game.cameo.win;
  if (!cw) return;
  var age = songTime() - cw.start;
  var dur = cw.resolved ? 1.5 : 1.1;
  if (age < 0 || age > dur) return;
  var fadeIn = Math.min(1, age / 0.15);
  var fadeOut = cw.resolved ? 1 : Math.max(0, 1 - Math.max(0, age - 0.75) / 0.35);
  var alpha = Math.min(fadeIn, fadeOut);
  if (alpha <= 0) return;

  var x = 432, y = 66;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y + Math.sin(t * 6) * 1.5);
  /* shirt/shoulders */
  ctx.fillStyle = '#2d3f52';
  ctx.beginPath(); ctx.ellipse(0, 26, 22, 16, 0, 0, Math.PI); ctx.fill();
  /* neck + head */
  ctx.fillStyle = '#f0c9a0'; ctx.fillRect(-6, 8, 12, 10);
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 16, 0, 0, Math.PI*2); ctx.fill();
  /* neat side-parted hair */
  ctx.fillStyle = '#1c1620';
  ctx.beginPath(); ctx.ellipse(0, -9, 16, 10, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15, -6); ctx.quadraticCurveTo(-18, 4, -13, 10); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill();
  /* sharp brow, easy smile */
  ctx.fillStyle = '#1c1620';
  ctx.fillRect(-11, -3, 8, 3); ctx.fillRect(3, -3, 8, 3);
  ctx.strokeStyle = '#7a3b3b'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 6, 4, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = alpha;
  var bw = 122, bh = 34, bx = x - 146, by = y - 38;
  ctx.fillStyle = cw.resolved ? 'rgba(255,215,94,.96)' : 'rgba(255,246,234,.96)';
  rr(bx, by, bw, bh, 10); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx+bw-2, by+18); ctx.lineTo(bx+bw+13, by+25); ctx.lineTo(bx+bw-2, by+29);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#14101a';
  ctx.font = '700 13px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(cw.resolved ? 'おう!' : '高野さんー!', bx + bw/2, by + bh/2);
  ctx.restore();
}

function drawField(t){
  /* lane background */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, FIELD_TOP, VW, VH - FIELD_TOP); ctx.clip();
  ctx.fillStyle = '#120e1c'; ctx.fillRect(0, FIELD_TOP, VW, VH - FIELD_TOP);

  for (var l = 0; l < 3; l++){
    var x = LANES_X[l];
    var g = ctx.createLinearGradient(0, FIELD_TOP, 0, VH);
    g.addColorStop(0, 'rgba(255,255,255,.02)');
    g.addColorStop(1, 'rgba(255,255,255,.07)');
    ctx.fillStyle = g; ctx.fillRect(x, FIELD_TOP, LANE_W, VH - FIELD_TOP);
    if (laneFx[l] > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + (laneFx[l] * 0.13) + ')';
      ctx.fillRect(x, FIELD_TOP, LANE_W, VH - FIELD_TOP);
    }
    ctx.strokeStyle = 'rgba(255,246,234,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, FIELD_TOP); ctx.lineTo(x, VH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+LANE_W, FIELD_TOP); ctx.lineTo(x+LANE_W, VH); ctx.stroke();
  }

  /* notes */
  var st = songTime();
  var spd = currentSpeed();
  for (var i = 0; i < game.notes.length; i++){
    var n = game.notes[i];
    if (n.dead && !(n.type==='hold' && n.holding)) continue;
    var y = JUDGE_Y - (n.t - st) * spd;
    if (y < FIELD_TOP - 60) continue;
    var x0 = LANES_X[n.lane];

    if (n.type === 'hold'){
      var yEnd = JUDGE_Y - (n.end - st) * spd;
      var top = Math.min(y, yEnd), bot = Math.max(y, yEnd);
      if (n.holding) bot = Math.min(bot, JUDGE_Y);
      ctx.globalAlpha = n.holding ? 1 : 0.85;
      ctx.fillStyle = game.aniki ? 'rgba(255,215,94,.45)' : LANE_DEEP[n.lane];
      rr(x0 + 30, top, LANE_W - 60, Math.max(6, bot - top), 14); ctx.fill();
      ctx.globalAlpha = 1;
      if (!n.holding) drawNoteHead(x0, y, n.lane, 'うんうん');
      continue;
    }
    if (n.type === 'trap'){
      ctx.save();
      ctx.fillStyle = '#2a2430';
      rr(x0 + 8, y - 17, LANE_W - 16, 34, 9); ctx.fill();
      ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
      rr(x0 + 8, y - 17, LANE_W - 16, 34, 9); ctx.stroke();
      ctx.fillStyle = '#ff9b9b';
      ctx.font = '800 13px "Hiragino Kaku Gothic ProN",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('聞きました', x0 + LANE_W/2, y);
      ctx.restore();
      continue;
    }
    drawNoteHead(x0, y, n.lane, LANE_LABEL[n.lane]);
  }

  /* judge line + the visible hit zone around it (this is what's actually
     being measured — tap while a note sits inside this glow) */
  var jx0 = LANES_X[0] - 4, jx1 = LANES_X[2] + LANE_W + 4;
  ctx.save();
  ctx.fillStyle = game.aniki ? 'rgba(255,215,94,.10)' : 'rgba(255,246,234,.06)';
  ctx.fillRect(jx0, JUDGE_Y - PX_GOOD, jx1 - jx0, PX_GOOD * 2);
  ctx.fillStyle = game.aniki ? 'rgba(255,215,94,.16)' : 'rgba(111,211,232,.10)';
  ctx.fillRect(jx0, JUDGE_Y - PX_GREAT, jx1 - jx0, PX_GREAT * 2);
  ctx.restore();

  ctx.strokeStyle = game.aniki ? 'rgba(255,215,94,.9)' : 'rgba(255,246,234,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(jx0, JUDGE_Y); ctx.lineTo(jx1, JUDGE_Y); ctx.stroke();

  /* pads — centered on the judge line, so the button itself is the target */
  for (var l2 = 0; l2 < 3; l2++){
    var px = LANES_X[l2];
    ctx.fillStyle = laneHeld[l2] ? 'rgba(255,246,234,.22)' : 'rgba(255,246,234,.07)';
    rr(px + 6, JUDGE_Y - 37, LANE_W - 12, 74, 12); ctx.fill();
    ctx.strokeStyle = LANE_COLOR[l2]; ctx.globalAlpha = laneHeld[l2] ? 1 : .5;
    ctx.lineWidth = 2;
    rr(px + 6, JUDGE_Y - 37, LANE_W - 12, 74, 12); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = LANE_COLOR[l2];
    ctx.font = '800 15px "Hiragino Kaku Gothic ProN",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(LANE_LABEL[l2], px + LANE_W/2, JUDGE_Y);
    if (game.cameo.win && !game.cameo.win.resolved){
      var pulse = 0.5 + 0.5 * Math.sin(now() * 14);
      ctx.save();
      ctx.globalAlpha = 0.55 * pulse;
      ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3;
      rr(px + 3, JUDGE_Y - 40, LANE_W - 6, 80, 14); ctx.stroke();
      ctx.restore();
    }
  }

  /* particles */
  for (var p = 0; p < particles.length; p++){
    var q = particles[p];
    ctx.globalAlpha = Math.max(0, 1 - q.age / q.life);
    ctx.fillStyle = q.c;
    ctx.fillRect(q.x, q.y, 3.5, 3.5);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawNoteHead(x0, y, lane, label){
  ctx.save();
  var col = game.aniki ? '#ffd75e' : LANE_COLOR[lane];
  ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  rr(x0 + 8, y - 17, LANE_W - 16, 34, 9); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#14101a';
  ctx.font = '800 14px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x0 + LANE_W/2, y);
  ctx.restore();
}

function drawHud(t){

  ctx.fillStyle = 'rgba(255,246,234,.14)'; ctx.fillRect(0, 0, VW, 5);

  ctx.fillStyle = 'rgba(255,246,234,.16)'; rr(mx, my, mw, mh, 5); ctx.fill();
  var mc = game.mood > 55 ? '#7fd88f' : game.mood > 25 ? '#ffb35c' : '#ff6b6b';

  ctx.fillText(CHARTS[game.stage].sub + '・' + CHARTS[game.stage].name + '・' + DIFF_LABEL[game.difficulty], VW - 14, 36);
  }

  /* combo */
  if (game.mode !== 'title' && game.combo >= 3){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var pop = Math.max(0, 1 - (now() - game.judgeTime) * 6);
    ctx.save();
    ctx.translate(VW/2, 300);
    ctx.scale(1 + pop*0.14, 1 + pop*0.14);
    ctx.fillStyle = game.aniki ? 'rgba(255,215,94,.9)' : 'rgba(255,246,234,.28)';
    ctx.font = '900 46px "Hiragino Kaku Gothic ProN",sans-serif';

    ctx.fillText(game.aniki ? '兄貴モード' : '連続相槌', 0, 32);

  }

    ctx.save();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 22px "Hiragino Kaku Gothic ProN",sans-serif';

                  : game.judgeKind === 'great' ? '#7fd88f'
                  : game.judgeKind === 'good' ? '#9fc7ff' : '#ff6b6b';
    ctx.fillText(game.judgeText, VW/2, JUDGE_Y - 58 - age*14);
    ctx.restore();
  }

  /* count-in */
  if (game.mode === 'count'){
    var left = game.startTime - now();
    var num = Math.ceil(left);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,246,234,.9)';
    ctx.font = '900 66px "Hiragino Kaku Gothic ProN",sans-serif';
    ctx.fillText(num > 0 ? String(num) : 'どうぞ', VW/2, 380);
    ctx.font = '700 13px "Hiragino Kaku Gothic ProN",sans-serif';
    ctx.fillStyle = 'rgba(255,246,234,.6)';
    ctx.fillText('高野さんが近づいてくる…', VW/2, 430);

}

function drawPinchVignette(){
  if (game.mode !== 'play' || game.mood <= 0 || game.mood > 20) return;
  var k = 1 - game.mood / 20;
  var pulse = 0.5 + 0.5 * Math.sin(now() * (6 + k*10));

}

/* ============================ attract demo ============================ */
/* A short scripted sequence teaching tap / hold / trap-avoid, looped on the
   title screen using the real field renderer (game.notes + songTime()). */
var DEMO_SPEC = [
  { lane:0, t:0.0, type:'tap' },
  { lane:1, t:0.7, type:'tap' },
  { lane:2, t:1.4, type:'tap' },
  { lane:0, t:2.3, end:3.1, type:'hold' },
  { lane:1, t:4.0, type:'trap' },
  { lane:0, t:5.0, type:'tap' },
  { lane:1, t:5.35, type:'tap' },
  { lane:2, t:5.7, type:'tap' }
];
var DEMO_LEN = 7.4;
var demoState = { notes: [], start: 0 };
function buildDemoNotes(){
  return DEMO_SPEC.map(function(d){
    if (d.type === 'hold') return { lane:d.lane, t:d.t, end:d.end, type:'hold', hit:false, dead:false, holding:false, done:false, ticks:0 };
    if (d.type === 'trap') return { lane:d.lane, t:d.t, type:'trap', hit:false, dead:false };
    return { lane:d.lane, t:d.t, type:'tap', hit:false, dead:false };
  });
}
function resetDemo(){
  demoState.notes = buildDemoNotes();
  demoState.start = now();
  laneHeld = [false,false,false]; laneFx = [0,0,0]; particles.length = 0;
}
function stepDemo(dt2){
  var arr = demoState.notes;
  for (var i = 0; i < arr.length; i++){
    var n = arr[i];
    if (n.type === 'trap'){
      if (!n.hit && dt2 > n.t + 0.35){ n.hit = true; setJudge('スルーが正解', 'great'); }
      continue;
    }
    if (n.type === 'hold'){
      if (!n.holding && !n.done && dt2 >= n.t){
        n.holding = true; n.hit = true; laneHeld[n.lane] = true; laneFx[n.lane] = 1;
        burst(n.lane, LANE_COLOR[n.lane], 6);
      }
      if (n.holding && dt2 >= n.end){
        n.holding = false; n.done = true; laneHeld[n.lane] = false;
        setJudge('うんうん', 'perfect'); burst(n.lane, LANE_COLOR[n.lane], 12);
      }
      continue;
    }
    if (!n.hit && dt2 >= n.t){
      n.hit = true; laneFx[n.lane] = 1;
      setJudge('ばっちり', 'perfect'); burst(n.lane, LANE_COLOR[n.lane], 10);
    }
  }
}

/* ============================ loop ============================ */
var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var t = ts / 1000;
  var dt = Math.min(0.05, t - last || 0.016); last = t;

  scheduleBgm();

  if (game.mode === 'title'){
    var dt2 = now() - demoState.start;
    if (dt2 > DEMO_LEN) { resetDemo(); dt2 = 0; }
    game.notes = demoState.notes;
    game.startTime = now() - dt2;
    stepDemo(dt2);
  }

  if (game.mode === 'count' && now() >= game.startTime) game.mode = 'play';
  if (game.mode === 'play') updateNotes(dt);

  /* ピンチ演出: ambient shake + heartbeat kick as mood runs critically low */
  if (game.mode === 'play' && game.mood > 0 && game.mood <= 20){
    var pinch = 1 - game.mood / 20;
    game.shake = Math.max(game.shake, pinch * 0.16);
    var beatInterval = 0.6 - 0.35 * pinch;
    if (now() - game.lastHeartbeat > beatInterval){
      game.lastHeartbeat = now();
      kick(now());
    }
  }

  /* 隠しコマンド: hold all 3 lanes together for 1.2s to unlock 私服ver */
  if (game.mode === 'play' && laneHeld[0] && laneHeld[1] && laneHeld[2]){
    if (game.tripleHoldStart === null) game.tripleHoldStart = now();
    else if (!game.costume && now() - game.tripleHoldStart >= 1.2){
      game.costume = true;
      try { localStorage.setItem('takano_costume_unlocked', '1'); } catch(e){}
      game.costumeToast = now();
      sfxHit('aniki');
    }
  } else {
    game.tripleHoldStart = null;
  }

  for (var i = 0; i < 3; i++) laneFx[i] = Math.max(0, laneFx[i] - dt * 4);
  for (var p = particles.length - 1; p >= 0; p--){
    var q = particles[p];
    q.age += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 420*dt;
    if (q.age > q.life) particles.splice(p, 1);
  }
  game.flash = Math.max(0, game.flash - dt*1.6);
  game.shake = Math.max(0, game.shake - dt*2.2);

  ctx.save();
  if (game.shake > 0){
    ctx.translate((Math.random()-0.5)*game.shake*12, (Math.random()-0.5)*game.shake*12);
  }
  ctx.clearRect(-20, -20, VW+40, VH+40);
  drawScene(t);
  drawTakano(58, 176, 1.0, t);
  drawBubble(t);
  drawCameo(t);
  drawField(t);
  drawHud(t);
  drawPinchVignette();
  drawCostumeToast();
  ctx.restore();

  if (game.flash > 0){
    ctx.fillStyle = 'rgba(255,215,94,' + (game.flash * 0.4) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}
requestAnimationFrame(frame);

/* ============================ input ============================ */
function laneFromEvent(e){
  var r = cv.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width * VW;
  var y = (e.clientY - r.top) / r.height * VH;
  if (y < FIELD_TOP - 40) return -1;
  for (var i = 0; i < 3; i++){
    if (x >= LANES_X[i] - LANE_GAP/2 && x <= LANES_X[i] + LANE_W + LANE_GAP/2) return i;
  }
  return -1;
}
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var l = laneFromEvent(e);
  if (l < 0) return;
  pointerLane[e.pointerId] = l;
  if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch(err){} }
  pressLane(l);
});
function up(e){
  var l = pointerLane[e.pointerId];
  if (l === undefined) return;
  delete pointerLane[e.pointerId];
  var still = false;
  for (var k in pointerLane) if (pointerLane[k] === l) still = true;
  if (!still) releaseLane(l);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

var KEYMAP = { 'd':0, 'f':1, 'j':2, 'ArrowLeft':0, 'ArrowDown':1, 'ArrowRight':2 };
var keyDown = {};
window.addEventListener('keydown', function(e){
  var k = KEYMAP[e.key] !== undefined ? KEYMAP[e.key] : KEYMAP[e.key.toLowerCase()];
  if (k === undefined) return;
  e.preventDefault();
  if (keyDown[k]) return;
  keyDown[k] = true; pressLane(k);
});
window.addEventListener('keyup', function(e){
  var k = KEYMAP[e.key] !== undefined ? KEYMAP[e.key] : KEYMAP[e.key.toLowerCase()];
  if (k === undefined) return;
  keyDown[k] = false; releaseLane(k);
});

function feedbackLine(cleared, rank, trapHit, maxCombo){
  var base;
  if (!cleared) base = '機嫌を損ねて離脱…今日の高野さん充足度は低め。';
  else if (rank === 'S') base = '「いや〜よう聞いてくれた!」今日の高野さん充足度、文句なしのMAX。';
  else if (rank === 'A') base = '満足げに自分の席へ戻っていった。充足度は高め。';
  else if (rank === 'B') base = '「まあ、聞いてくれたな」という顔。充足度はふつう。';
  else base = 'ちょっと物足りなさそうな顔で仕事へ。充足度は低め。';
  var extra = '';
  if (cleared && trapHit > 0) extra += ' 「聞きました」を叩かれた回はちょっと拗ねてた。';
  if (cleared && maxCombo >= 20) extra += ' 途中で兄貴モードに入れたのがよっぽど嬉しかったらしい。';
  return base + extra;
}

  document.getElementById('resTitle').textContent = cleared
    ? (game.stage === CHARTS.length - 1 ? '話、全部さばいた。定時。' : '一本、聞き終えた')
    : '拗ねられた。話が最初に戻る';
  document.getElementById('resFeedback').textContent =
    feedbackLine(cleared, rank, game.trapHit, game.maxCombo);
  var rows = [
    ['スコア', game.score],
    ['ばっちり', c.perfect],
    ['いい相槌', c.great],
    ['まあまあ', c.good],
    ['スルー', c.miss],
    ['最大連続', game.maxCombo],
    ['自己ベスト', best]
  ];
  var html = '';
  for (var i = 0; i < rows.length; i++){
    html += '<tr><td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td></tr>';
  }
  document.getElementById('resBody').innerHTML = html;
  var nextBtn = document.getElementById('btnNext');
  nextBtn.style.display = cleared ? '' : 'none';
  nextBtn.textContent = game.stage >= CHARTS.length - 1 ? 'タイトルへ' : '次の話へ';

  game.lastResult = {
    rank: rank,
    rankColor: rank === 'S' ? '#ffd75e' : rank === 'A' ? '#7fd88f' : rank === 'F' ? '#ff6b6b' : '#fff6ea',
    resultTitle: document.getElementById('resTitle').textContent,
    stageLabel: CHARTS[game.stage].sub + '・' + CHARTS[game.stage].name,
    diffLabel: DIFF_LABEL[game.difficulty],
    score: game.score,
    rows: rows.slice(1),
    feedback: feedbackLine(cleared, rank, game.trapHit, game.maxCombo)
  };

  show(resultScreen);
}

/* ============================ share image ============================ */
function buildShareCanvas(){
  var d = game.lastResult;
  if (!d) return null;
  var savedCtx = ctx;
  var scv = document.getElementById('shareCv');
  var W = 640, H = 800;
  scv.width = W; scv.height = H;
  ctx = scv.getContext('2d');

  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1733'); g.addColorStop(0.55, '#221b42'); g.addColorStop(1, '#3a2c46');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,246,234,.55)';
  for (var i = 0; i < 46; i++){
    ctx.fillRect(Math.random()*W, Math.random()*H*0.45, 1.6, 1.6);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff6ea';
  ctx.font = '800 24px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillText('高野さん、それ聞きました', W/2, 64);
  ctx.font = '700 14px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = 'rgba(255,246,234,.7)';
  ctx.fillText(d.stageLabel + '・' + d.diffLabel, W/2, 90);

  ctx.font = '900 160px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = d.rankColor;
  ctx.fillText(d.rank, W/2, 300);

  ctx.font = '700 18px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = '#fff6ea';
  ctx.fillText(d.resultTitle, W/2, 344);

  ctx.font = '900 46px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = '#ffd75e';
  ctx.fillText(d.score + ' 点', W/2, 404);

  var ry = 460;
  ctx.font = '700 16px "Hiragino Kaku Gothic ProN",sans-serif';
  d.rows.forEach(function(r){
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,246,234,.65)';
    ctx.fillText(r[0], W/2 - 120, ry);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff6ea';
    ctx.fillText(String(r[1]), W/2 + 120, ry);
    ry += 30;
  });

  ctx.textAlign = 'center';
  ctx.font = '600 15px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = 'rgba(255,246,234,.85)';
  var lines = wrap(d.feedback, 24);
  var fy = ry + 22;
  lines.forEach(function(l){ ctx.fillText(l, W/2, fy); fy += 22; });

  ctx.font = '700 11px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle = 'rgba(255,246,234,.4)';
  ctx.fillText('高野さん、それ聞きました — 相槌の攻防', W/2, H - 24);

  ctx = savedCtx;
  return scv;
}

document.getElementById('btnShare').addEventListener('click', function(){
  var scv = buildShareCanvas();
  if (!scv) return;
  scv.toBlob(function(blob){
    if (!blob) return;
    var file;
    try { file = new File([blob], 'takano-aizuchi-result.png', { type: 'image/png' }); } catch(e){}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: '高野さん、それ聞きました' }).catch(function(){});
      return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'takano-aizuchi-result.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
});

resetDemo();
resize();
})();
</script>
